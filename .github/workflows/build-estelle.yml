name: Build ESTELLE Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ESTELLE"
        required: true
        default: "0.7.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ESTELLE source package
        shell: pwsh
        run: |
          if (-not (Test-Path "estelle-build/ESTELLE_SOURCE.zip")) {
            throw "Ajoute estelle-build/ESTELLE_SOURCE.zip avant de lancer le workflow."
          }

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path estelle-build/source | Out-Null
          Expand-Archive -Path estelle-build/ESTELLE_SOURCE.zip -DestinationPath estelle-build/source -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          Push-Location estelle-build
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ inputs.version }}" "ESTELLE-PUBLIC.iss"
          Pop-Location

      - name: Optional code signing
        if: ${{ secrets.ESTELLE_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.ESTELLE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.ESTELLE_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "estelle-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $installer = Get-ChildItem estelle-build/output/ESTELLE-Setup-*.exe | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -match "\\x64\\signtool.exe$" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "SignTool introuvable" }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d ESTELLE $installer.FullName
          & $signtool.FullName verify /pa /v $installer.FullName

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash estelle-build/output/ESTELLE-Setup-*.exe -Algorithm SHA256 | Format-List

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESTELLE-Installer-${{ inputs.version }}
          path: estelle-build/output/ESTELLE-Setup-*.exe
          if-no-files-found: error
